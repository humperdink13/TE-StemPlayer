[package]
name = "stem-app"
version = "0.1.0"
description = "Stem Player Studio - Desktop app for managing TE Stem Player"
authors = ["you"]
edition = "2021"

[lib]
name = "stem_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4.3"
sha2 = "0.10"
hex = "0.4"
tokio = { version = "1", features = ["full"] }
